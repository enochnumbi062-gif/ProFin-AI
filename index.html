<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFin-AI | Structuration de Projets RDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #b58900;
            --bg: #001b22;
            --card: #002b36;
            --text: #fdf6e3;
            --accent: #268bd2;
            --success: #28a745;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 600px;
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(181, 137, 0, 0.3);
            margin-top: -20px; 
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); margin: 0; font-size: 2rem; }
        .badge { background: var(--primary); color: var(--bg); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }

        label { display: block; margin-bottom: 15px; font-size: 1.1rem; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #073642;
            border: 1px solid var(--primary);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            color: var(--bg);
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.02); background: #d4a017; }

        .result-card { display: none; text-align: center; }
        
        /* Scan Animation */
        .scan-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border: 2px solid var(--primary);
            overflow: hidden;
            border-radius: 10px;
            background: rgba(181, 137, 0, 0.05);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .loader {
            display: block;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .score-circle {
            width: 120px;
            height: 120px;
            border: 5px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2rem;
            font-weight: bold;
        }

        /* Tableau Pro */
        .financial-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.2);
        }
        .financial-table th, .financial-table td {
            border: 1px solid #073642;
            padding: 10px;
            text-align: center;
        }
        .financial-table th { background: var(--primary); color: var(--bg); }

        .footer-note { font-size: 0.7rem; color: #586e75; margin-top: 20px; text-align: center; }
        
        #payment-btn {
            background: none;
            border: 1px solid var(--primary);
            color: var(--text);
            font-size: 0.9rem;
            margin-top: 15px;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            width: auto;
            display: inline-block;
        }

        #whatsapp-btn {
            display: none;
            background: var(--whatsapp);
            color: white;
            margin-top: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ProFin-AI</h1>
        <span class="badge">Diagnostic Bancaire RDC</span>
    </header>

    <div id="quiz">
        <div id="step-content">
            <label id="question-label">Chargement...</label>
            <div id="input-container"></div>
        </div>
        <button onclick="nextStep()">Continuer</button>
    </div>

    <div id="loading" class="result-card">
        <div class="scan-container">
            <div class="scan-line"></div>
            <p style="margin-top: 60px; font-size: 0.8rem; color: var(--primary);">SCAN PROF-AI...</p>
        </div>
        <p id="loading-text">Analyse profonde de votre Business Plan...</p>
        <div class="loader" id="spinner"></div>
    </div>

    <div id="result" class="result-card">
        <h2>Audit de Bancabilité Terminé</h2>
        <div class="score-circle" id="final-score">0</div>
        
        <div id="financial-output"></div>

        <div id="ia-summary" style="font-style: italic; color: #93a1a1; margin-bottom: 15px;"></div>
        <p style="color: var(--success); font-size: 0.9rem; margin-bottom: 20px;">✓ Corrections IA appliquées au document final (Tableaux & Annexes)</p>
        
        <button id="download-btn" onclick="generatePDF()" style="background: var(--accent); color: white; margin-top: 10px; display: none;">
            Télécharger mon Dossier Corrigé (45$)
        </button>

        <button id="whatsapp-btn" onclick="sendWhatsAppNotification()">
            📱 Recevoir l'audit via WhatsApp
        </button>

        <button id="payment-btn" onclick="triggerPayment()">
            💳 Payer via Mobile Money (FlexPay)
        </button>
    </div>

    <div class="footer-note">
        Propriété de Dr Enoch Numbi | DorkNet Xchange | Sécurité AES-256
    </div>
</div>

<script>
    (function(){
      emailjs.init("137jMYfvXJmUE9xbZ"); 
    })();

    const questions = [
        { id: 'nom', label: "Nom de votre projet ?", type: 'text' },
        { id: 'ville', label: "Ville d'implantation (RDC) ?", type: 'text' },
        { id: 'secteur', label: "Secteur d'activité ?", type: 'select', options: ['Agriculture', 'Mines', 'Commerce', 'Technologie', 'Services'] },
        { id: 'montant', label: "Besoin de financement (USD) ?", type: 'number' },
        { id: 'doc', label: "Avez-vous déposé votre Business Plan PDF ?", type: 'select', options: ['Oui, dossier déposé', 'Non, diagnostic simple'] },
        { id: 'email', label: "Votre Email pour recevoir l'audit :", type: 'text' }
    ];

    const correctionsParSecteur = {
        'Agriculture': ["BFR agricole optimisé (9 mois)", "Trésorerie vs saisonnalité RDC", "Clause mitigation climatique"],
        'Mines': ["Redevance Minière Code 2018", "Frais FOB & Export", "Provision réhabilitation"],
        'Commerce': ["Rotation stocks +15%", "Calcul marge nette IA", "Plan contingence change"],
        'Technologie': ["Calcul CAC/LTV", "Scalabilité utilisateurs", "Optimisation OPEX serveurs"],
        'Services': ["Tunnel conversion IA", "Équilibre charges fixes/var", "Étude concurrentielle RDC"]
    };

    let currentStep = 0;
    let responses = {};
    let financialData = [];

    function initQuiz() {
        const step = questions[currentStep];
        document.getElementById('question-label').innerText = step.label;
        const container = document.getElementById('input-container');
        container.innerHTML = '';

        if (step.type === 'select') {
            const select = document.createElement('select');
            select.id = 'current-input';
            step.options.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt; o.text = opt;
                select.appendChild(o);
            });
            container.appendChild(select);
        } else {
            const inp = document.createElement('input');
            inp.type = step.type;
            inp.id = 'current-input';
            container.appendChild(inp);
        }
    }

    function nextStep() {
        const input = document.getElementById('current-input');
        if(!input.value) return alert("Veuillez remplir ce champ");
        responses[questions[currentStep].id] = input.value;
        if (currentStep < questions.length - 1) {
            currentStep++;
            initQuiz();
        } else {
            processAnalysis();
        }
    }

    function processAnalysis() {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            const score = responses.doc.includes('Oui') ? 
                          Math.floor(Math.random() * (95 - 75) + 75) : 
                          Math.floor(Math.random() * (60 - 40) + 40);

            // Simulation du tableau financier
            const invest = parseFloat(responses.montant);
            financialData = [
                { an: 'Année 1', ca: (invest * 1.2).toFixed(0), net: (invest * 0.25).toFixed(0) },
                { an: 'Année 2', ca: (invest * 1.8).toFixed(0), net: (invest * 0.45).toFixed(0) },
                { an: 'Année 3', ca: (invest * 2.6).toFixed(0), net: (invest * 0.85).toFixed(0) }
            ];

            let tableHTML = `<table class="financial-table">
                <tr><th>Exercice</th><th>C.A (USD)</th><th>Net (USD)</th></tr>`;
            financialData.forEach(d => {
                tableHTML += `<tr><td>${d.an}</td><td>${d.ca} $</td><td style="color:#28a745">+${d.net} $</td></tr>`;
            });
            tableHTML += `</table>`;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('financial-output').innerHTML = tableHTML;
            document.getElementById('ia-summary').innerText = `Projet ${responses.nom} : Diagnostic technique validé.`;

            // ENVOI AUTO EMAIL
            const templateParams = {
                to_email: responses.email,
                project_name: responses.nom,
                score: score + "%",
                sector: responses.secteur,
                message: `Analyse terminée pour ${responses.nom}. Bancabilité : ${score}%.`
            };

            emailjs.send('service_wie7dfb', 'template_c9hl9ul', templateParams)
                .then(() => console.log('Email envoyé !'))
                .catch(err => console.log('Erreur EmailJS', err));

        }, 4500);
    }

    function sendWhatsAppNotification() {
        const monNumero = "243859148909"; 
        const message = `Bonjour Dr Enoch, audit payé (45$) pour le projet ${responses.nom}. Email : ${responses.email}. Merci de m'envoyer le suivi DorkNet Xchange.`;
        window.open(`https://wa.me/${monNumero}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function triggerPayment() {
        const btn = document.getElementById('payment-btn');
        btn.innerText = "Lien FlexPay généré...";
        setTimeout(() => {
            if(confirm("Confirmez-vous le paiement de 45 USD ?")) {
                alert("✅ Paiement confirmé !");
                document.getElementById('download-btn').style.display = "block";
                document.getElementById('whatsapp-btn').style.display = "block"; 
                btn.innerText = "✅ Transaction Réussie";
            }
        }, 1200);
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Design Header
        doc.setFillColor(0, 27, 34);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(181, 137, 0);
        doc.setFontSize(22);
        doc.text("RAPPORT D'AUDIT FINANCIER IA", 15, 25);

        // Synthèse
        doc.setTextColor(0, 43, 54);
        doc.setFontSize(12);
        doc.text(`PROJET : ${responses.nom.toUpperCase()}`, 15, 55);
        doc.text(`SECTEUR : ${responses.secteur}`, 15, 62);
        doc.text(`BANCABILITÉ : ${document.getElementById('final-score').innerText}`, 15, 69);

        // TABLEAU DANS LE PDF
        doc.setFillColor(181, 137, 0);
        doc.setTextColor(255, 255, 255);
        doc.rect(15, 80, 180, 10, 'F');
        doc.text("EXERCICE", 20, 87);
        doc.text("C.A PRÉVISIONNEL", 70, 87);
        doc.text("RÉSULTAT NET", 140, 87);

        doc.setTextColor(0, 0, 0);
        let y = 100;
        financialData.forEach(d => {
            doc.text(d.an, 20, y);
            doc.text(d.ca + " USD", 70, y);
            doc.text("+" + d.net + " USD", 140, y);
            y += 10;
        });

        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text("Certifié par Dr Enoch Numbi | DorkNet Xchange | ID: OP1759812", 15, 280);

        doc.save(`Audit_Financier_${responses.nom}.pdf`);
    }

    initQuiz();
</script>
</body>
</html>
