<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFin-AI | Diagnostic Bancaire RDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #b58900;
            --bg: #001b22; /* Fond original de la capture 1 */
            --card: #002b36;
            --text: #fdf6e3;
            --accent: #268bd2;
            --success: #28a745;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(181, 137, 0, 0.3);
            text-align: center;
        }

        header h1 { color: var(--primary); margin: 0; font-size: 2.2rem; }
        .badge { background: var(--primary); color: var(--bg); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 20px; }

        label { display: block; margin-bottom: 15px; font-size: 1.1rem; text-align: left; }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #073642;
            border: 1px solid var(--primary);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            color: var(--bg);
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Scan Animation */
        .scan-container {
            position: relative;
            width: 100%;
            height: 100px;
            border: 1px solid var(--primary);
            overflow: hidden;
            margin: 20px 0;
            background: rgba(181, 137, 0, 0.05);
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .score-circle {
            width: 120px;
            height: 120px;
            border: 5px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .result-ui { display: none; }
        .loading-ui { display: none; }

        .footer-note { font-size: 0.7rem; color: #586e75; margin-top: 25px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ProFin-AI</h1>
        <div class="badge">Diagnostic Bancaire RDC</div>
    </header>

    <div id="quiz">
        <div id="step-content">
            <label id="question-label">Chargement...</label>
            <div id="input-container"></div>
        </div>
        <button onclick="nextStep()">Continuer</button>
    </div>

    <div id="loading" class="loading-ui">
        <div class="scan-container">
            <div class="scan-line"></div>
        </div>
        <p>Analyse IA du Business Plan en cours...</p>
    </div>

    <div id="result" class="result-ui">
        <h2>Audit de Bancabilité Terminé</h2>
        <div class="score-circle" id="final-score">0%</div>
        <p id="ia-summary" style="font-style: italic; margin-bottom: 20px;"></p>
        
        <button onclick="generatePDF()" style="background: var(--accent); color: white; margin-bottom: 10px;">
            Imprimer Rapport Complet (PDF Corrigé)
        </button>
        
        <button id="whatsapp-btn" onclick="sendWhatsAppNotification()" style="background: var(--whatsapp); color: white; margin-bottom: 10px; display: none;">
            📱 Recevoir via WhatsApp
        </button>

        <button id="payment-btn" onclick="triggerPayment()" style="background: none; border: 1px solid var(--primary); color: var(--text); font-size: 0.9rem;">
            💳 Débloquer Dossier Final (45$)
        </button>
    </div>

    <div class="footer-note">
        Propriété de Dr Enoch Numbi | DorkNet Xchange<br>Sécurisé par ProFin-Protocol AES-256
    </div>
</div>

<script>
    (function(){ emailjs.init("137jMYfvXJmUE9xbZ"); })();

    const questions = [
        { id: 'nom', label: "Nom de votre projet ?", type: 'text' },
        { id: 'ville', label: "Ville d'implantation (RDC) ?", type: 'text' },
        { id: 'secteur', label: "Secteur d'activité ?", type: 'select', options: ['Agriculture', 'Mines', 'Commerce', 'Technologie', 'Services'] },
        { id: 'montant', label: "Besoin de financement (USD) ?", type: 'number' },
        { id: 'doc', label: "Dépôt Business Plan ?", type: 'select', options: ['Oui, dossier déposé', 'Non, diagnostic simple'] },
        { id: 'email', label: "Votre Email :", type: 'text' }
    ];

    const correctionsParSecteur = {
        'Agriculture': ["Ajustement du cycle de récolte", "Optimisation des intrants"],
        'Mines': ["Conformité Code Minier RDC", "Recalcul redevances"],
        'Commerce': ["Optimisation BFR", "Gestion de stock"],
        'Technologie': ["Valorisation immatérielle", "Plan de scalabilité"],
        'Services': ["Structuration charges fixes", "Marge nette"]
    };

    let currentStep = 0; let responses = {};

    function initQuiz() {
        const step = questions[currentStep];
        document.getElementById('question-label').innerText = step.label;
        const container = document.getElementById('input-container');
        container.innerHTML = '';
        if (step.type === 'select') {
            const select = document.createElement('select'); select.id = 'current-input';
            step.options.forEach(opt => { let o = document.createElement('option'); o.value = opt; o.text = opt; select.appendChild(o); });
            container.appendChild(select);
        } else {
            const inp = document.createElement('input'); inp.type = step.type; inp.id = 'current-input'; container.appendChild(inp);
        }
    }

    function nextStep() {
        const input = document.getElementById('current-input');
        if(!input.value) return alert("Veuillez remplir ce champ");
        responses[questions[currentStep].id] = input.value;
        if (currentStep < questions.length - 1) { currentStep++; initQuiz(); } else { processAnalysis(); }
    }

    function processAnalysis() {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        setTimeout(() => {
            const score = responses.doc.includes('Oui') ? Math.floor(Math.random() * (95 - 78) + 78) : 55;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('ia-summary').innerText = `Projet ${responses.nom} analysé. Structure bancable identifiée.`;
        }, 4000);
    }

    function triggerPayment() {
        if(confirm("Confirmez-vous le paiement de 45 USD ?")) {
            document.getElementById('whatsapp-btn').style.display = 'block';
            document.getElementById('payment-btn').innerText = "✅ Transaction Réussie";
        }
    }

    function sendWhatsAppNotification() {
        window.open(`https://wa.me/243859148909?text=${encodeURIComponent("Audit payé pour " + responses.nom)}`, '_blank');
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFillColor(0, 27, 34); doc.rect(0, 0, 210, 40, 'F');
        doc.setFontSize(20); doc.setTextColor(181, 137, 0); doc.text("RAPPORT D'AUDIT PROFIN-AI", 15, 25);
        doc.setFontSize(12); doc.setTextColor(0,0,0);
        doc.text(`Projet: ${responses.nom}`, 15, 60);
        doc.text(`Score: ${document.getElementById('final-score').innerText}`, 15, 70);
        doc.text("Corrections: " + (correctionsParSecteur[responses.secteur] || ["Audit standard"]), 15, 80);
        doc.save(`Audit_${responses.nom}.pdf`);
    }

    initQuiz();
</script>
</body>
</html>
