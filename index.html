<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFin-AI | Structuration de Projets RDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #b58900;
            --bg: #001b22;
            --card: #002b36;
            --text: #fdf6e3;
            --accent: #268bd2;
            --success: #28a745;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(181, 137, 0, 0.2);
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin: 0; font-size: 2rem; }
        .badge { background: var(--primary); color: var(--bg); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }

        label { display: block; margin-bottom: 15px; font-size: 1.1rem; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #073642;
            border: 1px solid var(--primary);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            color: var(--bg);
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.02); background: #d4a017; }

        .result-card { display: none; text-align: center; }
        
        /* --- ANIMATION SCAN LASER --- */
        .scan-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border: 2px solid var(--primary);
            overflow: hidden;
            border-radius: 10px;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .loader {
            display: block;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .score-circle {
            width: 120px;
            height: 120px;
            border: 5px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2rem;
            font-weight: bold;
        }

        .footer-note { font-size: 0.7rem; color: #586e75; margin-top: 20px; text-align: center; }
        
        #payment-btn {
            background: none;
            border: 1px solid var(--primary);
            color: var(--text);
            font-size: 0.9rem;
            margin-top: 15px;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            width: auto;
            display: inline-block;
        }

        #whatsapp-btn {
            display: none;
            background: var(--whatsapp);
            color: white;
            margin-top: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ProFin-AI</h1>
        <span class="badge">Diagnostic Bancaire RDC</span>
    </header>

    <div id="quiz">
        <div id="step-content">
            <label id="question-label">Chargement...</label>
            <div id="input-container"></div>
        </div>
        <button onclick="nextStep()">Continuer</button>
    </div>

    <div id="loading" class="result-card">
        <div class="scan-container">
            <div class="scan-line"></div>
            <p style="margin-top: 60px; font-size: 0.8rem; color: var(--primary);">SCAN PDF...</p>
        </div>
        <p id="loading-text">Analyse de la structure de votre projet en cours...</p>
        <div class="loader" id="spinner"></div>
    </div>

    <div id="result" class="result-card">
        <h2>Analyse du Dossier Terminée</h2>
        <div class="score-circle" id="final-score">0</div>
        <p id="ia-summary" style="font-style: italic; color: #93a1a1;"></p>
        
        <button id="download-btn" onclick="generatePDF()" style="background: var(--accent); color: white; margin-top: 20px; display: none;">
            Télécharger le Rapport d'Audit Complet (45$)
        </button>

        <button id="whatsapp-btn" onclick="sendWhatsAppNotification()">
            📱 Recevoir mon audit sur WhatsApp
        </button>

        <button id="payment-btn" onclick="triggerPayment()">
            💳 Paiement Mobile Money sécurisé
        </button>
    </div>

    <div class="footer-note">
        Propriété de Dr Enoch Numbi | Analyse de Business Plan certifiée AES-256
    </div>
</div>

<script>
    (function(){
      emailjs.init("137jMYfvXJmUE9xbZ"); 
    })();

    const questions = [
        { id: 'nom', label: "Nom de votre projet ?", type: 'text' },
        { id: 'ville', label: "Ville d'implantation (RDC) ?", type: 'text' },
        { id: 'secteur', label: "Secteur d'activité ?", type: 'select', options: ['Agriculture', 'Mines', 'Commerce', 'Technologie', 'Services'] },
        { id: 'montant', label: "Besoin de financement (USD) ?", type: 'number' },
        { id: 'doc', label: "Avez-vous téléchargé votre Business Plan PDF ci-dessus ?", type: 'select', options: ['Oui, dossier prêt', 'En cours de rédaction'] },
        { id: 'email', label: "Votre adresse Email pour l'audit :", type: 'text' }
    ];

    let currentStep = 0;
    let responses = {};

    function initQuiz() {
        const step = questions[currentStep];
        document.getElementById('question-label').innerText = step.label;
        const container = document.getElementById('input-container');
        container.innerHTML = '';

        if (step.type === 'select') {
            const select = document.createElement('select');
            select.id = 'current-input';
            step.options.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt; o.text = opt;
                select.appendChild(o);
            });
            container.appendChild(select);
        } else {
            const inp = document.createElement('input');
            inp.type = step.type;
            inp.id = 'current-input';
            container.appendChild(inp);
        }
    }

    function nextStep() {
        const input = document.getElementById('current-input');
        if(!input.value) return alert("Veuillez remplir ce champ");
        responses[questions[currentStep].id] = input.value;
        if (currentStep < questions.length - 1) {
            currentStep++;
            initQuiz();
        } else {
            processAnalysis();
        }
    }

    function processAnalysis() {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            const score = responses.doc === 'Oui, dossier prêt' ? 
                          Math.floor(Math.random() * (92 - 65) + 65) : 
                          Math.floor(Math.random() * (60 - 35) + 35);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('final-score').innerText = score + "%";
            
            let avis = score > 70 ? "Structure solide. Quelques faiblesses identifiées dans le plan financier." : "Dossier incomplet. Manque d'indicateurs de rentabilité (TRI/VAN).";
            document.getElementById('ia-summary').innerText = `Analyse du projet ${responses.nom} terminée. ${avis}`;
            
            sendEmailReceipt("Audit de Business Plan", `Le score d'audit pour ${responses.nom} est de ${score}%. Document certifié par Dr Enoch Numbi.`);
        }, 4500); // Temps allongé pour apprécier le scan
    }

    function sendEmailReceipt(subject, message) {
        emailjs.send("service_wie7dfb", "template_c9hl9ul", {
            to_email: responses.email,
            project_name: responses.nom,
            message: message,
            subject: subject
        }).then(() => console.log("Audit envoyé !"), (err) => console.error("Erreur EmailJS:", err));
    }

    function sendWhatsAppNotification() {
        const monNumero = "243859148909"; 
        const message = `Bonjour Dr Enoch, j'ai soumis mon Business Plan pour ${responses.nom}. Score obtenu : ${document.getElementById('final-score').innerText}. J'ai payé les 45$ pour l'audit complet.`;
        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${monNumero}?text=${encodedMessage}`, '_blank');
    }

    function triggerPayment() {
        const btn = document.getElementById('payment-btn');
        btn.innerText = "Connexion FlexPay RDC...";
        btn.disabled = true;

        setTimeout(() => {
            let confirmPay = confirm("Confirmez-vous le paiement de 45 USD pour débloquer l'audit détaillé de votre Business Plan ?");
            if(confirmPay) {
                alert("✅ Audit validé !");
                document.getElementById('download-btn').style.display = "block";
                document.getElementById('whatsapp-btn').style.display = "block"; 
                btn.innerText = "✅ Transaction Terminée";
            } else {
                btn.innerText = "💳 Paiement Mobile Money sécurisé";
                btn.disabled = false;
            }
        }, 1000);
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22);
        doc.setTextColor(181, 137, 0);
        doc.text("AUDIT DE BANCABILITÉ PROFIN-AI", 20, 30);
        doc.setFontSize(12);
        doc.setTextColor(0, 43, 54);
        doc.text(`Projet analysé : ${responses.nom}`, 20, 50);
        doc.text(`Audit réalisé pour : ${responses.email}`, 20, 60);
        doc.line(20, 75, 190, 75);
        doc.text("RÉSULTAT DE L'ANALYSE DOCUMENTAIRE :", 20, 90);
        doc.text(`Score Final : ${document.getElementById('final-score').innerText}`, 20, 100);
        doc.text("Commentaire IA : " + document.getElementById('ia-summary').innerText, 20, 115, { maxWidth: 160 });
        doc.text("Audit certifié par Dr Enoch Numbi - DorkNet Xchange", 20, 280);
        doc.save(`Audit_ProFin_${responses.nom}.pdf`);
    }

    initQuiz();
</script>
</body>
</html>
